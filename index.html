<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDM SMM Panel</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Paystack Inline SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 30px 15px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; color: #94a3b8; margin-bottom: 20px; }
        
        .order-options { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #94a3b8; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        .form-card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: left; border: 1px solid #334155; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        
        .pay-btn { display: block; width: 100%; padding: 14px; background: #25d366; color: #ffffff; font-weight: bold; border-radius: 8px; font-size: 1rem; border: none; cursor: pointer; text-align: center; }
        .pay-online { background: #38bdf8; color: #0f172a; }
        
        footer { font-size: 0.85rem; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HKDM SMM Panel</h1>
        <p class="subtitle">Fast • Reliable • Affordable Social Media Growth</p>

        <div class="order-options">
            <button class="tab-btn active" id="btnOnline" onclick="toggleMode('online')">💳 Pay Online (Card/Transfer)</button>
            <button class="tab-btn" id="btnWhatsapp" onclick="toggleMode('whatsapp')">💬 Order via WhatsApp</button>
        </div>

        <div class="form-card">
            <form id="orderForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name" required>
                </div>

                <div class="form-group" id="emailGroup">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="e.g. client@gmail.com">
                </div>

                <div class="form-group">
                    <label>Phone / WhatsApp Number</label>
                    <input type="tel" id="phone" placeholder="e.g. 08135349371" required>
                </div>

                <div class="form-group">
                    <label>Select Platform</label>
                    <select id="platform" required>
                        <option value="">-- Select Platform --</option>
                        <option value="Instagram">Instagram</option>
                        <option value="TikTok">TikTok</option>
                        <option value="YouTube">YouTube</option>
                        <option value="Facebook">Facebook</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Service</label>
                    <select id="service" required>
                        <option value="">-- Select Service --</option>
                        <option value="Followers / Subscribers">Followers / Subscribers</option>
                        <option value="Likes">Likes</option>
                        <option value="Views">Views</option>
                        <option value="Shares">Shares</option>
                        <option value="Saves">Saves</option>
                        <option value="Comments">Comments</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Page / Video Link</label>
                    <input type="url" id="link" placeholder="Paste link here" required>
                </div>

                <div class="form-group">
                    <label id="qtyOrAmtLabel">Quantity (Units)</label>
                    <input type="number" id="quantity" placeholder="e.g. 1000" required>
                </div>

                <button type="button" id="submitBtn" onclick="processOrder()" class="pay-btn pay-online">Pay Online & Submit Order</button>
            </form>
        </div>

        <footer>© 2026 HKDM Social Media Marketing</footer>
    </div>

    <script>
        const SUPABASE_URL = "https://pdolwwhxattbfrtivnns.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkb2x3d2h4YXR0YmZydGl2bm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MTEyNjgsImV4cCI6MjEwMDQ4NzI2OH0.YAWIsmC1L95iw7RV2C6_QQ3GoRcq6Gi9Iumvd33zR4g"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'online';

        function toggleMode(mode) {
            currentMode = mode;
            const btnOnline = document.getElementById('btnOnline');
            const btnWhatsapp = document.getElementById('btnWhatsapp');
            const emailGroup = document.getElementById('emailGroup');
            const submitBtn = document.getElementById('submitBtn');

            if (mode === 'online') {
                btnOnline.classList.add('active');
                btnWhatsapp.classList.remove('active');
                emailGroup.style.display = 'block';
                submitBtn.innerText = 'Pay Online & Submit Order';
                submitBtn.className = 'pay-btn pay-online';
            } else {
                btnWhatsapp.classList.add('active');
                btnOnline.classList.remove('active');
                emailGroup.style.display = 'none';
                submitBtn.innerText = 'Submit Order to WhatsApp';
                submitBtn.className = 'pay-btn';
            }
        }

        function processOrder() {
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const platform = document.getElementById('platform').value;
            const service = document.getElementById('service').value;
            const link = document.getElementById('link').value;
            const quantity = document.getElementById('quantity').value;

            if (!name || !phone || !platform || !service || !link || !quantity) {
                alert('Please fill out all fields.');
                return;
            }

            if (currentMode === 'whatsapp') {
                const message = `Hello HKDM! I want to place an order:%0A%0A` +
                                `👤 *Name:* ${encodeURIComponent(name)}%0A` +
                                `📞 *Phone:* ${encodeURIComponent(phone)}%0A` +
                                `📱 *Platform:* ${encodeURIComponent(platform)}%0A` +
                                `🛠️ *Service:* ${encodeURIComponent(service)}%0A` +
                                `🔢 *Quantity:* ${encodeURIComponent(quantity)}%0A` +
                                `🔗 *Link:* ${encodeURIComponent(link)}`;
                window.open(`https://wa.me/2348135349371?text=${message}`, '_blank');
            } else {
                if (!email) {
                    alert('Email address is required for online payments.');
                    return;
                }

                const amount = 2000; 

                let handler = PaystackPop.setup({
                    key: 'pk_test_PLACEHOLDER_KEY', 
                    email: email,
                    amount: amount * 100,
                    currency: 'NGN',
                    ref: 'HKDM_' + Math.floor((Math.random() * 1000000000) + 1),
                    callback: async function(response) {
                        const { data, error } = await supabase.from('orders').insert([
                            {
                                full_name: name,
                                email: email,
                                phone: phone,
                                platform: platform,
                                service: service,
                                quantity: parseInt(quantity),
                                target_link: link,
                                amount: amount,
                                payment_ref: response.reference,
                                status: 'Pending'
                            }
                        ]);

                        if (error) {
                            alert('Order processed, but database failed to log. Ref: ' + response.reference);
                        } else {
                            alert('Payment Successful! Your order has been registered.');
                        }
                    }
                });
                handler.openIframe();
            }
        }
    </script>
</body>
</html>
