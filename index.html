<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDM SMM Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 40px 20px; line-height: 1.6; }

        .section-title { font-size: 1.4rem; color: #f8fafc; margin-bottom: 15px; text-align: left; border-bottom: 2px solid #334155; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 35px; }

</head>

        <h2 class="section-title">Our Services</h2>
        
        <div class="grid">
            <div class="card">
                <h3>Instagram</h3>

            </div>
            <div class="card">
                <h3>TikTok</h3>

            </div>
            <div class="card">

            </div>
            <div class="card">
