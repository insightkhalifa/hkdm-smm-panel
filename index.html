<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKDM Digital Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:active {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
    }
    .btn-secondary:active {
      background-color: #475569;
    }
  </style>
  <!-- Load official Kinde Web SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@kinde-oss/kinde-auth-web-sdk@2.1.2/dist/kinde-auth-web-sdk.min.js"></script>
</head>
<body>

  <div class="card">
    <div class="logo-text">HKDM Digital</div>
    <div class="subtitle">Welcome to your SMM Panel</div>

    <div class="btn-group">
      <button id="login-btn" class="btn btn-primary" type="button">Log In</button>
      <button id="register-btn" class="btn btn-secondary" type="button">Sign Up</button>
    </div>
  </div>

  <script>
    let kindeClient;

    async function initKinde() {
      // Initialize Kinde client securely using official Web SDK
      kindeClient = await createKindeClient({
        client_id: "3ce3ed295cfe47988291f19d1c157a1f",
        domain: "https://hkdm.kinde.com",
        redirect_uri: "https://hkdm-smm-panel.vercel.app",
        logout_redirect_uri: "https://hkdm-smm-panel.vercel.app"
      });

      // Handle authorization callback response from Kinde
      if (window.location.search.includes("code=")) {
        await kindeClient.handleRedirectCallback();
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    initKinde();

    document.getElementById("login-btn").addEventListener("click", async () => {
      if (kindeClient) {
        await kindeClient.login();
      }
    });

    document.getElementById("register-btn").addEventListener("click", async () => {
      if (kindeClient) {
        await kindeClient.register();
      }
    });
  </script>

</body>
</html>
