<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKDM Digital Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:active {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
    }
    .btn-secondary:active {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-text">HKDM Digital</div>
    <div class="subtitle">Welcome to your SMM Panel</div>

    <div class="btn-group">
      <button id="login-btn" class="btn btn-primary" type="button">Log In</button>
      <button id="register-btn" class="btn btn-secondary" type="button">Sign Up</button>
    </div>
  </div>

  <script>
    const KINDE_DOMAIN = "https://hkdm.kinde.com";
    const CLIENT_ID = "3ce3ed295cfe47988291f19d1c157a1f";
    const REDIRECT_URI = encodeURIComponent("https://hkdm-smm-panel.vercel.app");

    // Function to generate a secure random state string (16 chars)
    function generateRandomState() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let state = "";
      for (let i = 0; i < 16; i++) {
        state += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return state;
    }

    function redirectToKinde(startPage) {
      const state = generateRandomState();
      // Store state in localStorage for session verification
      localStorage.setItem("kinde_auth_state", state);

      const targetUrl = `${KINDE_DOMAIN}/oauth2/auth?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&scope=openid%20profile%20email&start_page=${startPage}&state=${state}`;
      
      window.location.href = targetUrl;
    }

    document.getElementById("login-btn").addEventListener("click", () => {
      redirectToKinde("login");
    });

    document.getElementById("register-btn").addEventListener("click", () => {
      redirectToKinde("registration");
    });
  </script>

</body>
</html>
