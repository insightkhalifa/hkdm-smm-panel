<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDM SMM Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 30px 15px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; color: #94a3b8; margin-bottom: 25px; }

        .form-card { background: #1e293b; padding: 25px 20px; border-radius: 12px; text-align: left; border: 1px solid #334155; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; background: #25d366; color: #ffffff; font-weight: bold; border-radius: 8px; font-size: 1.05rem; border: none; cursor: pointer; text-align: center; margin-top: 10px; transition: background 0.2s ease; }
        .whatsapp-btn:hover { background: #20ba5a; }
        
        footer { font-size: 0.85rem; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HKDM SMM Panel</h1>
        <p class="subtitle">Fast • Reliable • Affordable Social Media Growth</p>

        <div class="form-card">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Phone / WhatsApp Number</label>
                <input type="tel" id="phone" placeholder="e.g. 08135349371">
            </div>

            <div class="form-group">
                <label>Select Platform</label>
                <select id="platform">
                    <option value="">-- Select Platform --</option>
                    <option value="Instagram">Instagram</option>
                    <option value="TikTok">TikTok</option>
                    <option value="YouTube">YouTube</option>
                    <option value="Facebook">Facebook</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Service</label>
                <select id="service">
                    <option value="">-- Select Service --</option>
                    <option value="Followers / Subscribers">Followers / Subscribers</option>
                    <option value="Likes">Likes</option>
                    <option value="Views">Views</option>
                    <option value="Shares">Shares</option>
                    <option value="Saves">Saves</option>
                    <option value="Comments">Comments</option>
                </select>
            </div>

            <div class="form-group">
                <label>Target Page / Video Link</label>
                <input type="url" id="link" placeholder="Paste link here">
            </div>

            <div class="form-group">
                <label>Quantity (Units)</label>
                <input type="number" id="quantity" placeholder="e.g. 1000">
            </div>

            <button type="button" id="submitBtn" class="whatsapp-btn">💬 Send Order via WhatsApp</button>
        </div>

        <footer>© 2026 HKDM Digital Marketing</footer>
    </div>

    <script>
        document.getElementById('submitBtn').onclick = function() {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const platform = document.getElementById('platform').value;
            const service = document.getElementById('service').value;
            const link = document.getElementById('link').value.trim();
            const quantity = document.getElementById('quantity').value.trim();

            if (!name || !phone || !platform || !service || !link || !quantity) {
                alert('Please complete all fields before sending your order.');
                return;
            }

            const message = `Hello HKDM! I want to place an order:%0A%0A` +
                            `👤 *Name:* ${encodeURIComponent(name)}%0A` +
                            `📞 *Phone:* ${encodeURIComponent(phone)}%0A` +
                            `📱 *Platform:* ${encodeURIComponent(platform)}%0A` +
                            `🛠️ *Service:* ${encodeURIComponent(service)}%0A` +
                            `🔢 *Quantity:* ${encodeURIComponent(quantity)}%0A` +
                            `🔗 *Link:* ${encodeURIComponent(link)}`;

            window.open(`https://wa.me/2348135349371?text=${message}`, '_blank');
        };
    </script>
</body>
</html>
