<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKDM Digital SMM Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      border: 1px solid #334155;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:active {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
    }

    /* Main Dashboard Styles */
    .hidden {
      display: none !important;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #0284c7;
    }
    .price-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      border: 1px dashed #334155;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .logout-link {
      color: #ef4444;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- LOGIN / SIGN UP CARD -->
  <div id="auth-card" class="card">
    <div class="logo-text">HKDM Digital</div>
    <div class="subtitle">Welcome to your SMM Panel</div>

    <div class="btn-group">
      <button id="login-btn" class="btn btn-primary" type="button">Log In</button>
      <button id="register-btn" class="btn btn-secondary" type="button">Sign Up</button>
    </div>
  </div>

  <!-- MAIN SMM ORDERING DASHBOARD -->
  <div id="dashboard-card" class="card hidden">
    <div class="header-bar">
      <div style="font-weight:700; color:#38bdf8;">HKDM Digital</div>
      <span id="logout-btn" class="logout-link">Log Out</span>
    </div>

    <h2 style="font-size: 18px; margin-bottom: 16px;">Place New Order</h2>

    <form id="order-form">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option>TikTok Services</option>
          <option>Instagram Services</option>
          <option>YouTube Services</option>
        </select>
      </div>

      <div class="form-group">
        <label for="service">Service</label>
        <select id="service">
          <option value="10">TikTok Followers — $10 per 1,000</option>
          <option value="5">TikTok Likes — $5 per 1,000</option>
          <option value="15">Instagram Followers — $15 per 1,000</option>
        </select>
      </div>

      <div class="form-group">
        <label for="link">Target Link / URL</label>
        <input type="url" id="link" placeholder="https://..." required />
      </div>

      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" placeholder="1000" min="100" value="1000" required />
      </div>

      <div class="price-box">
        <span>Total Charge:</span>
        <span id="total-price" style="color:#38bdf8;">$10.00</span>
      </div>

      <button type="submit" class="btn btn-primary">Submit Order</button>
    </form>
  </div>

  <script>
    const KINDE_DOMAIN = "https://hkdm.kinde.com";
    const CLIENT_ID = "3ce3ed295cfe47988291f19d1c157a1f";
    const REDIRECT_URI = "https://hkdm-smm-panel.vercel.app";

    const authCard = document.getElementById("auth-card");
    const dashboardCard = document.getElementById("dashboard-card");

    // 1. Check if user is returning from authentication
    const urlParams = new URLSearchParams(window.location.search);
    const hasCode = urlParams.get("code");
    const isLoggedIn = localStorage.getItem("hkdm_logged_in") === "true";

    if (hasCode || isLoggedIn) {
      // Save login state
      localStorage.setItem("hkdm_logged_in", "true");
      // Clean URL bar
      window.history.replaceState({}, document.title, window.location.pathname);
      // Display dashboard
      authCard.classList.add("hidden");
      dashboardCard.classList.remove("hidden");
    }

    // 2. PKCE OAuth Helpers
    function generateRandomString(length) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let result = "";
      const randomValues = new Uint8Array(length);
      window.crypto.getRandomValues(randomValues);
      for (let i = 0; i < length; i++) {
        result += chars[randomValues[i] % chars.length];
      }
      return result;
    }

    async function generateCodeChallenge(codeVerifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(codeVerifier);
      const digest = await window.crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function startAuthFlow(startPage) {
      const state = generateRandomString(16);
      const codeVerifier = generateRandomString(64);
      const codeChallenge = await generateCodeChallenge(codeVerifier);

      sessionStorage.setItem("kinde_state", state);
      sessionStorage.setItem("kinde_code_verifier", codeVerifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: "code",
        scope: "openid profile email",
        state: state,
        code_challenge: codeChallenge,
        code_challenge_method: "S256",
        start_page: startPage
      });

      window.location.href = `${KINDE_DOMAIN}/oauth2/auth?${params.toString()}`;
    }

    document.getElementById("login-btn").addEventListener("click", () => startAuthFlow("login"));
    document.getElementById("register-btn").addEventListener("click", () => startAuthFlow("registration"));

    // 3. Logout handler
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("hkdm_logged_in");
      window.location.href = `${KINDE_DOMAIN}/logout?redirect=${encodeURIComponent(REDIRECT_URI)}`;
    });

    // 4. Dynamic Order Calculator
    const serviceSelect = document.getElementById("service");
    const quantityInput = document.getElementById("quantity");
    const totalPriceEl = document.getElementById("total-price");

    function updatePrice() {
      const ratePer1000 = parseFloat(serviceSelect.value);
      const qty = parseInt(quantityInput.value) || 0;
      const total = (qty / 1000) * ratePer1000;
      totalPriceEl.textContent = `$${total.toFixed(2)}`;
    }

    serviceSelect.addEventListener("change", updatePrice);
    quantityInput.addEventListener("input", updatePrice);

    document.getElementById("order-form").addEventListener("submit", (e) => {
      e.preventDefault();
      alert("Order submitted successfully!");
    });
  </script>

</body>
</html>
