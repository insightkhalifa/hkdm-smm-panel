<!-- 1. Include Kinde SDK -->
<script src="https://cdn.jsdelivr.net/npm/@kinde-oss/kinde-typescript-sdk@2/dist/kinde-sdk.js"></script>

<!-- 2. UI Buttons -->
<div id="logged_out_view">
  <button id="login" type="button">Log In</button>
  <button id="register" type="button">Sign Up</button>
</div>

<!-- 3. Kinde Initialization Script -->
<script>
  let kinde;

  async function initKinde() {
    // Create Kinde Instance
    kinde = await createKindeClient({
      client_id: "3ce3ed295c1", // Your Client ID from image 11
      domain: "https://hkdm.kinde.com",
      redirect_uri: window.location.origin
    });

    // Check if user is already logged in
    const isAuthenticated = await kinde.isAuthenticated();
    if (isAuthenticated) {
      const user = await kinde.getUser();
      console.log("Logged in user:", user);
      // Redirect to dashboard or hide login buttons here
    }

    // Attach Event Listeners to Buttons
    document.getElementById("login").addEventListener("click", async () => {
      await kinde.login();
    });

    document.getElementById("register").addEventListener("click", async () => {
      await kinde.register();
    });
  }

  // Initialize on page load
  document.addEventListener("DOMContentLoaded", initKinde);
</script>
