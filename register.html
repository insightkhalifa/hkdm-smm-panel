<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKDM SMM Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #334155;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:active {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #ffffff;
    }
    .btn-secondary:active {
      background-color: #475569;
    }
    #user-info {
      display: none;
      margin-top: 16px;
      word-break: break-all;
    }
  </style>

  <!-- Kinde SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@kinde-oss/kinde-typescript-sdk@2/dist/kinde-sdk.js"></script>
</head>
<body>

  <div class="card">
    <div class="logo-text">HKDM Digital</div>
    <div class="subtitle">Welcome to your SMM Panel</div>

    <div id="logged_out_view" class="btn-group">
      <button id="login" class="btn btn-primary" type="button">Log In</button>
      <button id="register" class="btn btn-secondary" type="button">Sign Up</button>
    </div>

    <div id="logged_in_view" style="display: none;">
      <p style="margin-bottom: 16px; color: #4ade80;">Successfully Logged In!</p>
      <div id="user-details" class="subtitle"></div>
      <button id="logout" class="btn btn-secondary" type="button">Log Out</button>
    </div>
  </div>

  <script>
    let kinde;

    async function initKinde() {
      try {
        kinde = await createKindeClient({
          client_id: "3ce3ed295c1",
          domain: "https://hkdm.kinde.com",
          redirect_uri: window.location.origin
        });

        const isAuthenticated = await kinde.isAuthenticated();

        if (isAuthenticated) {
          const user = await kinde.getUser();
          document.getElementById("logged_out_view").style.display = "none";
          document.getElementById("logged_in_view").style.display = "block";
          document.getElementById("user-details").textContent = `Logged in as: ${user.email || user.given_name || "User"}`;
        }

        document.getElementById("login").addEventListener("click", async () => {
          await kinde.login();
        });

        document.getElementById("register").addEventListener("click", async () => {
          await kinde.register();
        });

        const logoutBtn = document.getElementById("logout");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async () => {
            await kinde.logout();
          });
        }
      } catch (err) {
        console.error("Kinde Init Error:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", initKinde);
  </script>

</body>
</html>
