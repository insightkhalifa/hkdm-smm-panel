<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDM - New Customer Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 30px 15px; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 5px; }
        .subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px; }

        .form-card { background: #1e293b; padding: 25px 20px; border-radius: 12px; text-align: left; border: 1px solid #334155; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        
        .submit-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; background: #38bdf8; color: #0f172a; font-weight: bold; border-radius: 8px; font-size: 1.05rem; border: none; cursor: pointer; text-align: center; margin-top: 10px; transition: background 0.2s ease; }
        .submit-btn:hover { background: #0284c7; color: #ffffff; }

        .login-link { text-align: center; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
        .login-link a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        footer { font-size: 0.85rem; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create HKDM Account</h1>
        <p class="subtitle">Register to unlock fast social media growth services</p>

        <form id="regForm" class="form-card" onsubmit="handleRegistration(event)">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="regPhone">WhatsApp / Phone Number</label>
                <input type="tel" id="regPhone" placeholder="e.g. 08135349371" required>
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="e.g. client@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="regPlatform">Primary Platform Interested In</label>
                <select id="regPlatform">
                    <option value="TikTok">TikTok Growth</option>
                    <option value="Instagram">Instagram Growth</option>
                    <option value="YouTube">YouTube Monetization/Growth</option>
                    <option value="Facebook">Facebook Page Growth</option>
                    <option value="All Platforms">All Platforms</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">📝 Register Account</button>

            <div class="login-link">
                Already registered? <a href="index.html">Go to Order Panel</a>
            </div>
        </form>

        <footer>© 2026 HKDM Digital Marketing</footer>
    </div>

    <script>
        function handleRegistration(event) {
            event.preventDefault();

            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const platform = document.getElementById('regPlatform').value;

            if (!name || !phone || !email) {
                alert('Please complete all registration fields.');
                return;
            }

            const message = "Hello HKDM! I want to register as a new customer:%0A%0A" +
                            "👤 *Name:* " + encodeURIComponent(name) + "%0A" +
                            "📞 *Phone:* " + encodeURIComponent(phone) + "%0A" +
                            "✉️ *Email:* " + encodeURIComponent(email) + "%0A" +
                            "📱 *Primary Interest:* " + encodeURIComponent(platform);

            window.location.href = "https://wa.me/2348135349371?text=" + message;
        }
    </script>
</body>
</html>
